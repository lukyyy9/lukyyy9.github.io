<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchups.gg</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" href="./favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX transformation in-browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        .custom-scrollbar-hide::-webkit-scrollbar { display: none; }
        .custom-scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 antialiased selection:bg-blue-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icônes SVG intégrées pour l'UI
        const Icons = {
          Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
          ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
          ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
          ChevronDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
          ChevronUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>,
          X: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
          Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
          Swords: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="M10.9 10.9l2.2 2.2"/></svg>,
          Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
          Grip: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1.5"/><circle cx="9" cy="5" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="15" cy="19" r="1.5"/></svg>,
          Star: ({ filled }) => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
          Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
          Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
          Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
          BarChart: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
        };

        // Champions manquants dans l'API officielle
        const RECENT_CHAMPS = [
          { id: "Mel", name: "Mel", image: { full: "Mel.png" } },
          { id: "Yunara", name: "Yunara", image: { full: "Yunara.png" } },
          { id: "Zaahen", name: "Zaahen", image: { full: "Zaahen.png" } },
          { id: "Locke", name: "Locke", image: { full: "Locke.png" } }
        ];

        // Gestionnaire du Drag & Drop pour la liste de priorité
        function DraggablePriorityList({ myPicks, enemy, allPool, onUpdate, version }) {
            const handleDragStart = (e, index, source) => {
                e.dataTransfer.setData("text/plain", JSON.stringify({ index, source, champId: myPicks[index] }));
                e.dataTransfer.effectAllowed = "move";
            };

            const handleDrop = (e, targetIndex) => {
                e.preventDefault();
                try {
                    const data = JSON.parse(e.dataTransfer.getData("text/plain"));
                    const sourceIndex = data.index;
                    const source = data.source;
                    const champId = data.champId;

                    let newPicks = [...myPicks];

                    if (source === 'priority') {
                        if (sourceIndex === targetIndex) return;
                        const [movedItem] = newPicks.splice(sourceIndex, 1);
                        newPicks.splice(targetIndex, 0, movedItem);
                    } else if (source === 'pool') {
                        if (enemy.id === champId) return; // Pas de match miroir
                        if (newPicks.includes(champId)) return; // Déjà dans la liste
                        
                        if (targetIndex === -1) {
                            newPicks.push(champId);
                        } else {
                            newPicks.splice(targetIndex, 0, champId);
                        }
                    }
                    
                    onUpdate(enemy.id, newPicks);
                } catch (err) {
                    console.error("Erreur lors du drop", err);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
            };

            const removePick = (indexToRemove) => {
                const newPicks = myPicks.filter((_, idx) => idx !== indexToRemove);
                onUpdate(enemy.id, newPicks);
            };

            return (
                <div 
                    className="flex-1 flex flex-wrap gap-2 p-3 bg-slate-900/40 rounded-xl min-h-[72px] items-center border-2 border-dashed border-slate-700/50 hover:border-blue-500/50 transition-colors"
                    onDrop={(e) => handleDrop(e, -1)}
                    onDragOver={handleDragOver}
                >
                    {myPicks.length === 0 ? (
                        <div className="w-full text-center text-slate-500 text-sm italic pointer-events-none">
                            Glissez un champion ici depuis votre réserve...
                        </div>
                    ) : (
                        myPicks.map((pickId, idx) => {
                            const champ = allPool.find(c => c.id === pickId);
                            if (!champ) return null;
                            return (
                                <div 
                                    key={`${pickId}-${idx}`} 
                                    draggable
                                    onDragStart={(e) => handleDragStart(e, idx, 'priority')}
                                    onDrop={(e) => {
                                        e.stopPropagation();
                                        handleDrop(e, idx);
                                    }}
                                    onDragOver={handleDragOver}
                                    className="flex items-center bg-slate-800 rounded-full pr-3 pl-1.5 py-1.5 border border-slate-600 shadow-sm cursor-grab active:cursor-grabbing hover:border-blue-400 hover:bg-slate-700 transition-all"
                                >
                                    <img 
                                        src={`https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${champ.id}.png`} 
                                        alt={champ.name}
                                        className="w-7 h-7 rounded-full mr-2 pointer-events-none shadow-sm"
                                        onError={(e) => { e.target.src = 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/-1.png'; }}
                                    />
                                    <span className="text-sm font-semibold text-slate-200 pointer-events-none">{champ.name}</span>
                                    <button 
                                        onClick={() => removePick(idx)}
                                        className="ml-2 text-slate-400 hover:text-red-400 p-1 rounded-full hover:bg-slate-600 transition-colors"
                                        title="Retirer de la priorité"
                                    >
                                        <Icons.X />
                                    </button>
                                </div>
                            );
                        })
                    )}
                </div>
            );
        }

        // Carte d'affrontement individuelle
        function MatchupCard({ enemy, myPicks, allPool, onUpdate, version, isPinned, onTogglePin }) {
            return (
                <div className="bg-slate-800/60 backdrop-blur-sm rounded-2xl p-5 flex flex-col lg:flex-row lg:items-center gap-6 border border-slate-700/60 shadow-xl hover:border-slate-500/80 transition-all">
                    {/* L'Adversaire */}
                    <div className="flex items-center w-full lg:w-64 flex-shrink-0">
                        <button 
                            onClick={() => onTogglePin(enemy.id)}
                            className={`mr-4 transition-transform hover:scale-110 ${isPinned ? 'text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.5)]' : 'text-slate-600 hover:text-yellow-400/50'}`}
                            title={isPinned ? "Désépingler" : "Épingler"}
                        >
                            <Icons.Star filled={isPinned} />
                        </button>
                        <img 
                            src={`https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${enemy.id}.png`} 
                            alt={enemy.name}
                            className="w-14 h-14 rounded-xl border-2 border-slate-600 shadow-lg"
                            onError={(e) => { e.target.src = 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/-1.png'; }}
                        />
                        <div className="ml-4">
                            <div className="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Adversaire</div>
                            <div className="font-black text-slate-100 text-xl tracking-tight leading-none">{enemy.name}</div>
                        </div>
                    </div>

                    {/* Zone de Priorité */}
                    <div className="flex-1 flex flex-col w-full justify-center">
                        <div className="text-xs text-slate-500 font-bold uppercase tracking-widest mb-2 lg:hidden">Priorité de Draft</div>
                        <DraggablePriorityList 
                            myPicks={myPicks} 
                            enemy={enemy} 
                            allPool={allPool} 
                            onUpdate={onUpdate} 
                            version={version} 
                        />
                    </div>
                </div>
            );
        }

        // Modal d'Analytics
        function AnalyticsModal({ myPool, matchups, champions, pinnedChampions, version, onClose }) {
            // Calcul des statistiques
            const firstPicks = {};
            const backupPicks = {};
            const totalUses = {};
            const pairs = {};
            let configuredMatchupsCount = 0;

            // Initialisation
            myPool.forEach(id => totalUses[id] = 0);

            // Analyse des choix
            pinnedChampions.forEach(enemyId => {
                const picks = matchups[enemyId] || [];
                if (picks.length > 0) configuredMatchupsCount++;
                
                picks.forEach((pickId, idx) => {
                    totalUses[pickId] = (totalUses[pickId] || 0) + 1;
                    if (idx === 0) {
                        firstPicks[pickId] = (firstPicks[pickId] || 0) + 1;
                    } else {
                        backupPicks[pickId] = (backupPicks[pickId] || 0) + 1;
                    }
                });

                // Analyse des duos (combinaisons dans une même sélection)
                for(let i = 0; i < picks.length; i++) {
                    for(let j = i + 1; j < picks.length; j++) {
                        const sorted = [picks[i], picks[j]].sort();
                        const key = `${sorted[0]}|${sorted[1]}`;
                        pairs[key] = (pairs[key] || 0) + 1;
                    }
                }
            });

            const sortObject = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);
            
            const topTotal = sortObject(totalUses).filter(x => x[1] > 0).slice(0, 5);
            const topFirst = sortObject(firstPicks).slice(0, 5);
            const topBackup = sortObject(backupPicks).slice(0, 5);
            const topPairs = sortObject(pairs).slice(0, 5);
            // Champions les moins utilisés dans le pool
            const leastUsed = Object.entries(totalUses).sort((a, b) => a[1] - b[1]).slice(0, 5);
            
            const coveragePercentage = pinnedChampions.length > 0 
                ? Math.round((configuredMatchupsCount / pinnedChampions.length) * 100) 
                : 0;

            const renderChampMini = (id, count) => {
                const champ = champions.find(c => c.id === id);
                if (!champ) return null;
                return (
                    <div key={id} className="flex items-center justify-between p-2 bg-slate-700/30 rounded-lg mb-1.5">
                        <div className="flex items-center">
                            <img src={`https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${id}.png`} alt={champ.name} className="w-6 h-6 rounded-md mr-2" />
                            <span className="text-sm font-medium text-slate-200">{champ.name}</span>
                        </div>
                        <span className="text-xs font-bold text-blue-400 bg-blue-900/30 px-2 py-0.5 rounded-full">{count} fois</span>
                    </div>
                );
            };

            return (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm overflow-y-auto">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-4xl shadow-2xl flex flex-col max-h-[90vh]">
                        <div className="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-800/80 rounded-t-2xl sticky top-0">
                            <h2 className="text-xl font-bold text-slate-100 flex items-center">
                                <Icons.BarChart /> <span className="ml-2">Statistiques & Analytics</span>
                            </h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700 transition-colors">
                                <Icons.X />
                            </button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto custom-scrollbar">
                            {pinnedChampions.length === 0 ? (
                                <div className="text-center text-slate-400 py-10">
                                    Ajoutez des champions épinglés et configurez vos priorités pour voir des statistiques.
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    {/* Jauge de couverture */}
                                    <div className="bg-slate-700/20 p-4 rounded-xl border border-slate-700/50">
                                        <div className="flex justify-between text-sm mb-2">
                                            <span className="text-slate-300 font-medium">Couverture des Matchups Épinglés</span>
                                            <span className="text-blue-400 font-bold">{coveragePercentage}% ({configuredMatchupsCount}/{pinnedChampions.length})</span>
                                        </div>
                                        <div className="w-full bg-slate-900 rounded-full h-3">
                                            <div className="bg-blue-500 h-3 rounded-full transition-all duration-1000" style={{ width: `${coveragePercentage}%` }}></div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* Total Uses (Blindpick) */}
                                        <div className="bg-slate-700/20 p-4 rounded-xl border border-slate-700/50">
                                            <h3 className="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Les plus utilisés (Blindpick)</h3>
                                            <div className="text-xs text-slate-500 mb-2">Total des sélections, peu importe la priorité.</div>
                                            {topTotal.length > 0 ? topTotal.map(([id, count]) => renderChampMini(id, count)) : <div className="text-xs text-slate-500">Pas de données</div>}
                                        </div>

                                        {/* First Picks */}
                                        <div className="bg-slate-700/20 p-4 rounded-xl border border-slate-700/50">
                                            <h3 className="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Choix n°1 les plus fréquents</h3>
                                            <div className="text-xs text-slate-500 mb-2">Champions choisis en première ligne de réponse.</div>
                                            {topFirst.length > 0 ? topFirst.map(([id, count]) => renderChampMini(id, count)) : <div className="text-xs text-slate-500">Pas de données</div>}
                                        </div>

                                        {/* Backups */}
                                        <div className="bg-slate-700/20 p-4 rounded-xl border border-slate-700/50">
                                            <h3 className="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Choix de secours (2+)</h3>
                                            <div className="text-xs text-slate-500 mb-2">Vos plans B habituels si le plan A ne convient pas.</div>
                                            {topBackup.length > 0 ? topBackup.map(([id, count]) => renderChampMini(id, count)) : <div className="text-xs text-slate-500">Pas de données</div>}
                                        </div>

                                        {/* Moins utilisés */}
                                        <div className="bg-slate-700/20 p-4 rounded-xl border border-slate-700/50">
                                            <h3 className="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Les moins utilisés (Fantômes)</h3>
                                            <div className="text-xs text-slate-500 mb-2">Candidats potentiels à retirer de votre pool.</div>
                                            {leastUsed.length > 0 ? leastUsed.map(([id, count]) => renderChampMini(id, count)) : <div className="text-xs text-slate-500">Votre pool est vide</div>}
                                        </div>

                                        {/* Duos */}
                                        <div className="bg-slate-700/20 p-4 rounded-xl border border-slate-700/50 md:col-span-2">
                                            <h3 className="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Duos récurrents</h3>
                                            <div className="text-xs text-slate-500 mb-2">Champions souvent sélectionnés contre le même adversaire (chevauchement stratégique).</div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-4">
                                                {topPairs.length > 0 ? topPairs.map(([key, count]) => {
                                                    const [id1, id2] = key.split('|');
                                                    const c1 = champions.find(c => c.id === id1);
                                                    const c2 = champions.find(c => c.id === id2);
                                                    if(!c1 || !c2) return null;
                                                    return (
                                                        <div key={key} className="flex items-center justify-between p-2 bg-slate-700/30 rounded-lg mb-1.5">
                                                            <div className="flex items-center space-x-2">
                                                                <img src={`https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${id1}.png`} alt="" className="w-6 h-6 rounded-md" />
                                                                <span className="text-slate-400 text-xs">+</span>
                                                                <img src={`https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${id2}.png`} alt="" className="w-6 h-6 rounded-md" />
                                                            </div>
                                                            <span className="text-xs font-bold text-purple-400 bg-purple-900/30 px-2 py-0.5 rounded-full">{count} fois</span>
                                                        </div>
                                                    )
                                                }) : <div className="text-xs text-slate-500">Pas assez de données multi-picks</div>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Application Principale
        function MatchupPlanner() {
            const [champions, setChampions] = useState([]);
            const [latestVersion, setLatestVersion] = useState("14.5.1");
            
            // Données locales
            const [myPool, setMyPool] = useState([]);
            const [matchups, setMatchups] = useState({});
            const [pinnedChampions, setPinnedChampions] = useState([]);

            // UI States
            const [searchTerm, setSearchTerm] = useState("");
            const [loading, setLoading] = useState(true);
            const [isPoolModalOpen, setIsPoolModalOpen] = useState(false);
            const [isAnalyticsModalOpen, setIsAnalyticsModalOpen] = useState(false);
            const [showOthers, setShowOthers] = useState(false);

            // Initialisation
            useEffect(() => {
                async function fetchChampions() {
                    try {
                        const vRes = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
                        const versions = await vRes.json();
                        const version = versions[0];
                        setLatestVersion(version);

                        const cRes = await fetch(`https://ddragon.leagueoflegends.com/cdn/${version}/data/en_US/champion.json`);
                        const cData = await cRes.json();
                        
                        const fetchedChamps = Object.values(cData.data);
                        const missingChamps = RECENT_CHAMPS.filter(rc => !cData.data[rc.id]);
                        const allFetchedChamps = [...fetchedChamps, ...missingChamps];
                        
                        const sortedAllChampions = allFetchedChamps.sort((a, b) => a.name.localeCompare(b.name));
                        setChampions(sortedAllChampions);
                        setLoading(false);
                    } catch (error) {
                        console.error("Erreur de chargement des champions:", error);
                        setLoading(false);
                    }
                }

                async function loadLocalData() {
                    try {
                        // Chargement automatique du fichier data.json depuis le dossier public/racine
                        const response = await fetch('./data.json');
                        if (response.ok) {
                            const importedData = await response.json();
                            if (importedData.myPool) setMyPool(importedData.myPool);
                            if (importedData.matchups) setMatchups(importedData.matchups);
                            if (importedData.pinnedChampions) setPinnedChampions(importedData.pinnedChampions);
                        }
                    } catch (error) {
                        console.log("Fichier data.json non trouvé. L'application démarre à vide.");
                    }
                }

                fetchChampions();
                loadLocalData();
            }, []);

            // Export JSON
            const handleExport = () => {
                const dataToExport = {
                    myPool,
                    matchups,
                    pinnedChampions
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href",     dataStr);
                downloadAnchorNode.setAttribute("download", "matchups_gg_backup.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            // Import JSON
            const handleImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (importedData.myPool) setMyPool(importedData.myPool);
                        if (importedData.matchups) setMatchups(importedData.matchups);
                        if (importedData.pinnedChampions) setPinnedChampions(importedData.pinnedChampions);
                    } catch (err) {
                        alert("Fichier invalide ou corrompu.");
                    }
                };
                reader.readAsText(file);
            };

            const updateMatchup = (enemyId, newPicks) => {
                setMatchups(prev => ({ ...prev, [enemyId]: newPicks }));
            };

            const togglePoolChampion = (champId) => {
                setMyPool(prev => {
                    if (prev.includes(champId)) return prev.filter(id => id !== champId);
                    return [...prev, champId];
                });
            };

            const togglePinChampion = (champId) => {
                setPinnedChampions(prev => {
                    if (prev.includes(champId)) return prev.filter(id => id !== champId);
                    return [...prev, champId];
                });
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center text-blue-400">
                        <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
                    </div>
                );
            }

            const filteredChampions = champions.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()));
            
            // Séparation des listes
            const pinnedList = filteredChampions.filter(c => pinnedChampions.includes(c.id));
            const otherList = filteredChampions.filter(c => !pinnedChampions.includes(c.id));
            const fullPool = champions.filter(c => myPool.includes(c.id));

            return (
                <div className="min-h-screen bg-slate-950 text-slate-300 font-sans selection:bg-blue-500/30">
                    {/* Top Navigation */}
                    <header className="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                                    <Icons.Swords />
                                </div>
                                <h1 className="text-xl font-black text-white tracking-tight">Matchups<span className="text-blue-500">.gg</span></h1>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                {/* Import / Export Outils */}
                                <div className="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
                                    <label className="cursor-pointer text-slate-400 hover:text-white p-2 rounded hover:bg-slate-700 transition-colors" title="Importer une sauvegarde JSON">
                                        <Icons.Upload />
                                        <input type="file" accept=".json" className="hidden" onChange={handleImport} />
                                    </label>
                                    <button onClick={handleExport} className="text-slate-400 hover:text-white p-2 rounded hover:bg-slate-700 transition-colors" title="Exporter une sauvegarde JSON">
                                        <Icons.Download />
                                    </button>
                                </div>
                                
                                <button 
                                    onClick={() => setIsAnalyticsModalOpen(true)}
                                    className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg font-medium transition-all border border-slate-700 shadow-sm"
                                >
                                    <Icons.BarChart /> <span className="hidden sm:inline">Statistiques</span>
                                </button>
                                
                                <button 
                                    onClick={() => setIsPoolModalOpen(true)}
                                    className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-medium transition-all shadow-lg shadow-blue-600/20"
                                >
                                    <Icons.Users /> <span className="hidden sm:inline">Mon Pool ({myPool.length})</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-8 xl:px-8 pb-40">
                        {/* Search Bar */}
                        <div className="relative mb-8 group">
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-blue-400 transition-colors">
                                <Icons.Search />
                            </div>
                            <input
                                type="text"
                                placeholder="Rechercher un champion..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded-2xl py-4 pl-12 pr-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all shadow-inner"
                            />
                        </div>

                        {/* Main Content Area */}
                        <div className="space-y-4">
                            {/* Champions Épinglés */}
                            <div className="mb-2">
                                <h2 className="text-lg font-bold text-white flex items-center mb-4">
                                    <span className="text-yellow-400 mr-2"><Icons.Star filled={true} /></span> 
                                    Matchups Épinglés ({pinnedList.length})
                                </h2>
                                {pinnedList.length === 0 ? (
                                    <div className="text-center py-12 bg-slate-900/50 rounded-xl border border-dashed border-slate-700">
                                        <p className="text-slate-400 mb-2">Aucun champion épinglé.</p>
                                        <p className="text-sm text-slate-500">Utilisez l'étoile sur un champion ci-dessous pour l'ajouter ici.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {pinnedList.map(champ => (
                                            <MatchupCard
                                                key={champ.id}
                                                enemy={champ}
                                                myPicks={matchups[champ.id] || []}
                                                allPool={fullPool}
                                                onUpdate={updateMatchup}
                                                version={latestVersion}
                                                isPinned={true}
                                                onTogglePin={togglePinChampion}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Autres Champions (Rétractable) */}
                            <div className="mt-8 pt-4 border-t border-slate-800">
                                <button 
                                    onClick={() => setShowOthers(!showOthers)}
                                    className="flex items-center w-full text-left py-2 text-slate-400 hover:text-slate-200 transition-colors group"
                                >
                                    <span className="mr-2 transform group-hover:scale-110 transition-transform">
                                        {showOthers ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
                                    </span>
                                    <h2 className="text-lg font-bold">Autres Champions ({otherList.length})</h2>
                                </button>
                                
                                {showOthers && (
                                    <div className="space-y-3 mt-4">
                                        {otherList.map(champ => (
                                            <MatchupCard
                                                key={champ.id}
                                                enemy={champ}
                                                myPicks={matchups[champ.id] || []}
                                                allPool={fullPool}
                                                onUpdate={updateMatchup}
                                                version={latestVersion}
                                                isPinned={false}
                                                onTogglePin={togglePinChampion}
                                            />
                                        ))}
                                        {otherList.length === 0 && (
                                            <div className="text-slate-500 text-center py-4">Aucun autre champion trouvé.</div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* Menu Flottant (Dock) */}
                    {fullPool.length > 0 && (
                        <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-30 pointer-events-none">
                            <div className="bg-slate-900/90 backdrop-blur-xl border border-slate-700/60 shadow-2xl p-3 rounded-2xl pointer-events-auto">
                                <div className="flex flex-wrap justify-center content-start gap-2.5 max-w-[360px] max-h-[140px] overflow-y-auto overflow-x-hidden custom-scrollbar pr-1">
                                    {fullPool.map(champ => (
                                        <div
                                            key={`dock-${champ.id}`}
                                            draggable
                                            onDragStart={(e) => {
                                                e.dataTransfer.setData("text/plain", JSON.stringify({ source: 'pool', champId: champ.id }));
                                                e.dataTransfer.effectAllowed = "copyMove";
                                            }}
                                            className="cursor-grab active:cursor-grabbing transform hover:-translate-y-1 hover:scale-110 transition-all duration-200 flex-shrink-0"
                                            title={champ.name}
                                        >
                                            <img 
                                                src={`https://ddragon.leagueoflegends.com/cdn/${latestVersion}/img/champion/${champ.id}.png`} 
                                                alt={champ.name}
                                                className="w-10 h-10 rounded-full border-2 border-slate-600 shadow-sm hover:border-blue-400 hover:shadow-blue-500/40 object-cover"
                                                onError={(e) => { e.target.src = 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/-1.png'; }}
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Pool Manager */}
                    {isPoolModalOpen && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-3xl shadow-2xl flex flex-col max-h-[85vh]">
                                <div className="p-5 border-b border-slate-700 flex justify-between items-center">
                                    <h2 className="text-xl font-bold text-slate-100 flex items-center">
                                        <Icons.Users /> <span className="ml-2">Mon Pool de Champions</span>
                                    </h2>
                                    <button onClick={() => setIsPoolModalOpen(false)} className="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700 transition-colors">
                                        <Icons.X />
                                    </button>
                                </div>
                                
                                <div className="p-4 bg-slate-900/50 text-sm text-slate-400 text-center border-b border-slate-700">
                                    Sélectionnez les champions que vous jouez. Ils apparaîtront comme options de réponse dans vos matchups.
                                </div>

                                <div className="p-6 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 custom-scrollbar">
                                    {champions.map(champ => {
                                        const inPool = myPool.includes(champ.id);
                                        return (
                                            <button
                                                key={`pool-${champ.id}`}
                                                onClick={() => togglePoolChampion(champ.id)}
                                                className={`flex items-center p-2 rounded-xl border transition-all ${
                                                    inPool 
                                                    ? 'bg-blue-500/10 border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.15)]' 
                                                    : 'bg-slate-800 border-slate-700 hover:border-slate-500 hover:bg-slate-700/50'
                                                }`}
                                            >
                                                <img 
                                                    src={`https://ddragon.leagueoflegends.com/cdn/${latestVersion}/img/champion/${champ.id}.png`} 
                                                    alt={champ.name}
                                                    className={`w-10 h-10 rounded-lg mr-3 transition-all ${inPool ? '' : 'grayscale opacity-60'}`}
                                                    onError={(e) => { e.target.src = 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/-1.png'; }}
                                                />
                                                <div className="flex flex-col text-left flex-1">
                                                    <span className={`font-semibold text-sm ${inPool ? 'text-blue-400' : 'text-slate-400'}`}>
                                                        {champ.name}
                                                    </span>
                                                </div>
                                                {inPool ? (
                                                    <div className="text-blue-400"><Icons.Check /></div>
                                                ) : (
                                                    <div className="text-slate-600 hover:text-slate-300"><Icons.Plus /></div>
                                                )}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Analytics */}
                    {isAnalyticsModalOpen && (
                        <AnalyticsModal 
                            myPool={myPool}
                            matchups={matchups}
                            champions={champions}
                            pinnedChampions={pinnedChampions}
                            version={latestVersion}
                            onClose={() => setIsAnalyticsModalOpen(false)}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MatchupPlanner />);
    </script>
</body>
</html>
